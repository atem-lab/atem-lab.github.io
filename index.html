<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATEM</title>
<meta name="description" content="ATEM: North Star, and Orrery, the context layer for AI.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="ATEM">
<meta property="og:description" content="North Star, and Orrery, the context layer for AI.">
<meta property="og:url" content="https://atem-lab.com/">
<meta property="og:type" content="website">
<meta property="og:image" content="https://atem-lab.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico?v=3" sizes="32x32">
<link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<link rel="manifest" href="/site.webmanifest">
<link rel="preload" href="/kit/fonts/michroma.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/kit/fonts/geist-mono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/kit/fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/kit/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* JetBrains Mono and Inter (SIL OFL 1.1, kit/fonts/LICENSE-*.txt), self-hosted, North Star's two faces. */
  @font-face { font-family: 'JetBrains Mono'; src: url('/kit/fonts/jetbrains-mono.woff2') format('woff2'); font-weight: 100 800; font-display: swap; }
  @font-face { font-family: 'Inter'; src: url('/kit/fonts/inter.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
  /* Major Mono Display (SIL OFL 1.1, fonts/LICENSE-MajorMonoDisplay.txt): Orrery's name. */
  @font-face { font-family: 'Major Mono Display'; src: url('/kit/fonts/major-mono-display.woff2') format('woff2'); font-display: swap; }
  /* Michroma (SIL OFL 1.1, fonts/LICENSE-Michroma.txt): the name. */
  @font-face { font-family: 'Michroma'; src: url('/kit/fonts/michroma.woff2') format('woff2'); font-display: swap; }
  /* Geist Mono (SIL OFL 1.1, fonts/LICENSE-GeistMono.txt): the small labels around it. */
  @font-face { font-family: 'Geist Mono'; src: url('/kit/fonts/geist-mono.woff2') format('woff2'); font-weight: 500; font-display: swap; }
  :root {
    --fg: #e6e6e6; --dim: #8a8a8a; --strong: #fff; --line: rgba(255, 255, 255, 0.16);
    --cyan: #2de2e6; --magenta: #ff3d9a; --orrery: #e8264f;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    --sans: 'Inter', system-ui, sans-serif;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-move: cubic-bezier(0.33, 1, 0.68, 1);
  }
  html, body { margin: 0; min-height: 100%; background: #000; color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  body { overflow-x: hidden; }
  canvas.field { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* A lab's index: the products are the page, in rows as big as a title. Pointing at one turns the whole field to its
     colour (North Star cyan, Orrery red) and opens its row. */
  .page { position: relative; z-index: 1; min-height: 100svh; box-sizing: border-box; display: flex; flex-direction: column; padding: 16px 24px 24px; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
  /* The name is a prompt: atem and a block cursor. An open row types a slash and its product, in that product's own
     face and colour; atem steps back. */
  h1 { flex: none; margin: 0; display: flex; align-items: baseline; font: 500 clamp(24px, 2.37vw, 45px)/1 var(--mono); color: var(--strong); white-space: nowrap; }
  /* Keeps the line's height and baseline while nothing is typed yet. */
  .lab::before { content: ''; display: inline-block; }
  .caret { position: relative; width: 0.6em; height: 0; margin-left: 0.06em; }
  .caret::before { content: ''; position: absolute; left: 0; top: -0.86em; width: 0.52em; height: 1.04em; background: var(--tone, var(--strong)); animation: blink 1.1s infinite; }
  h1[data-typing] .caret::before { animation: none; }
  @keyframes blink { 0%, 54.9% { opacity: 1; } 55%, 100% { opacity: 0; } }
  .lab { font: 400 0.82em/1.22 'Michroma', var(--sans); letter-spacing: -0.04em; transition: color 120ms; }
  .slash { position: relative; width: 0.56em; height: 0; }
  .slash::before { content: ''; position: absolute; left: calc(50% - 0.05em); top: -0.893em; width: 0.1em; height: 1.045em; background: var(--tone, var(--strong)); transform: rotate(16deg); transition: background-color 120ms; }
  h1:not([data-of]) .slash { display: none; }
  h1[data-of] .lab { color: var(--dim); }
  h1[data-of=ns] { --tone: var(--cyan); }
  h1[data-of=g] { --tone: var(--orrery); }
  /* No line of their own (line height 0): the products' faces sit on atem's baseline and never move it. */
  .of { white-space: pre; color: var(--tone); }
  h1[data-of=ns] .of { font: 400 1em/0 var(--mono); letter-spacing: -0.045em; }
  h1[data-of=g] .of { font: 400 0.9em/0 'Major Mono Display', var(--mono); letter-spacing: 0; text-transform: lowercase; }
  main { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
  /* The rows' contents sit a little in from the page's edge, on the same edge as the name ATEM's ink (measured below);
     their lines and the label run to the page's edge. */
  .rows { position: relative; --inset: 0px; }
  /* The glyphs never run under words: a black shade rising from the foot behind the rows. */
  .rows::before {
    content: ''; position: absolute; inset: -96px -24px -24px; z-index: -1; pointer-events: none;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.92) 55%, rgba(0, 0, 0, 0));
  }
  .label { margin: 0 0 12px; font: 500 12px/1 'Geist Mono', var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
  .item { border-top: 1px dashed var(--line); --tone: var(--strong); }
  .item:last-child { border-bottom: 1px dashed var(--line); }
  .head {
    display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 16px; width: 100%;
    padding: 18px 0 14px var(--inset); background: none; border: 0; color: inherit; text-align: left; cursor: pointer; font: inherit;
  }
  .title {
    display: inline-block; font: 500 clamp(48px, 10vw, 168px)/0.92 var(--sans); letter-spacing: -0.045em; color: var(--strong);
    transition: color 500ms var(--ease-move), transform 600ms var(--ease-move), filter 700ms var(--ease-move), opacity 700ms var(--ease-move);
  }
  .state { font: 500 12px/1 'Geist Mono', var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); display: inline-flex; align-items: center; gap: 8px; }
  .lamp { width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1px currentColor; }
  .item[data-live] .state { color: var(--cyan); }
  .item[data-live] .lamp { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
  .item[data-soon] .state { color: var(--orrery); }
  .item.open .title { color: var(--tone); }
  /* A row that is a link: all of it, details too, and an arrow at its end. */
  .item.ns { position: relative; }
  a.head { text-decoration: none; box-sizing: border-box; outline: none; }
  a.head::after { content: ''; position: absolute; inset: 0; }
  .go { align-self: center; width: clamp(28px, 5vw, 84px); height: auto; fill: none; stroke: var(--dim); stroke-width: 1.7; transform: translateX(-16%); transition: transform 600ms var(--ease-move), stroke 500ms var(--ease-move); }
  .item.open .go { stroke: var(--tone); transform: none; }
  /* Each name is pulled left by its first letter's own side space (measured below), so its ink starts where the text
     under it starts. */
  .title { margin-left: calc(var(--pull, 0) * -1px); }
  /* North Star's name exactly as its own landing sets it (Landing.module.css .title): JetBrains Mono, regular,
     tracking -0.045em, line height 1. */
  .ns .title { font: 400 clamp(48px, 10vw, 168px)/1 var(--mono); letter-spacing: -0.045em; }
  /* A row opens to its details: 600 ms, eased so the move is seen. */
  .more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 600ms var(--ease-move); }
  .item.open .more { grid-template-rows: 1fr; }
  .more > div { overflow: hidden; }
  .inner { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; padding: 0 0 24px var(--inset); }
  .inner p { margin: 0; max-width: 420px; font-size: 16px; line-height: 1.5; color: var(--fg); }
  .inner form { display: flex; gap: 8px; width: min(420px, 100%); }
  .formwrap { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .formwrap .note { max-width: 420px; text-align: right; text-wrap: balance; }

  /* North Star's page button (Button md): a white pill, the accent wiping in from the left on hover. */
  .button {
    position: relative; display: inline-flex; align-items: center; justify-content: center; flex: none;
    height: 36px; padding: 0 16px; border: 0; border-radius: 999px; background: #fff; color: #000;
    font: 500 14px/1 var(--sans); text-decoration: none; cursor: pointer; isolation: isolate; overflow: hidden;
    transition: color 200ms var(--ease), transform 70ms var(--ease);
  }
  .button::before {
    content: ''; position: absolute; inset: 0; z-index: -1; background: var(--accent, var(--magenta));
    transform: scaleX(0); transform-origin: left; transition: transform 400ms var(--ease);
  }
  .button:hover::before, .button:focus-visible::before { transform: scaleX(1); }
  .button:focus-visible { outline: none; }
  .button:active { transform: scale(0.97); }
  .button:disabled { opacity: 0.5; cursor: default; }
  .button:disabled::before { display: none; }
  /* North Star's field: a round well, a cyan ring from the keyboard. */
  .well {
    flex: 1; min-width: 0; height: 36px; box-sizing: border-box; padding: 0 16px;
    border: 1px solid var(--line); border-radius: 999px; background: rgba(255, 255, 255, 0.05);
    color: var(--strong); font: 400 14px var(--sans); outline: none;
    transition: border-color 200ms var(--ease), box-shadow 200ms var(--ease);
  }
  .well::placeholder { color: var(--dim); }
  .well:focus-visible { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan); }
  .trap { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  .note { min-height: 1.4em; margin: 0; font-size: 12px; color: var(--dim); }
  .note[data-state=ok] { color: var(--cyan); }
  .note[data-state=error] { color: var(--magenta); }
  .legal a { color: inherit; text-decoration: none; }
  .note a { color: inherit; text-decoration: underline; text-decoration-color: rgba(255, 255, 255, 0.3); text-underline-offset: 3px; }
  .note a:hover, .legal a:hover { color: var(--strong); }
  /* The legal pages, quiet at the top right, across from the name. */
  .legal { display: flex; gap: 16px; font: 500 12px/1 'Geist Mono', var(--mono); letter-spacing: 0.06em; color: var(--dim); }

  /* Orrery: a thin mono for everything in its section (North Star keeps Inter, in its own only); its name in Major Mono
     Display, red, and out of focus until you come close, then sharp and bright. */
  .g, .g .well, .g .button, .g .note, .g .inner p { font-family: var(--mono); }
  .g .inner p { font-weight: 300; font-size: 15px; letter-spacing: 0.01em; }
  .g .well, .g .button { font-size: 13px; }
  /* The face sits low in its line: the foot padding makes the space under the letters the same as over them. */
  .g .title { font: 400 clamp(44px, 9vw, 150px)/0.95 'Major Mono Display', var(--mono); padding-bottom: 0.13em; text-transform: lowercase; color: var(--orrery); filter: blur(clamp(3px, 0.4vw, 6px)); opacity: 0.9; }
  .g.open .title { color: var(--orrery); filter: blur(0); opacity: 1; }
  /* Still being made: the row's bottom line a thin red light that runs from left to right, again and again, like
     something loading. */
  .item.g { position: relative; }
  .item.g::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; pointer-events: none;
    background: linear-gradient(90deg, transparent, var(--orrery) 40%, var(--orrery) 60%, transparent) no-repeat;
    background-size: 40% 100%; animation: loading 3.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
  }
  @keyframes loading { from { background-position: -60% 0; } to { background-position: 160% 0; } }

  /* Nothing to point with: a tap goes straight to the product, so its line is there already. */
  @media (hover: none) { .ns .more { grid-template-rows: 1fr; } }
  @media (max-width: 360px) { h1 { font-size: 20px; } }
  @media (max-width: 760px) {
    header { gap: 8px; }
    /* One under the other: the name grows with a product's, and the links must not move for it. */
    .legal { flex-direction: column; align-items: flex-end; gap: 6px; line-height: 1.4; }
    .page { padding: 16px; }
    .rows::before { inset: -96px -16px -16px; }
    .inner { flex-direction: column; align-items: flex-start; }
    .formwrap { align-items: flex-start; width: 100%; }
    .formwrap .note { text-align: left; white-space: normal; }
  }
</style>
</head>
<body>
<canvas class="field" aria-hidden="true"></canvas>
<div class="page">
  <header><h1 aria-label="ATEM"><span class="lab" aria-hidden="true">atem</span><span class="slash" aria-hidden="true"></span><span class="of" aria-hidden="true"></span><span class="caret" aria-hidden="true"></span></h1><script>document.querySelector('.lab').textContent = ''</script><nav class="legal" aria-label="Legal"><a href="/impressum">Impressum</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a><a href="/contact">Contact</a></nav></header>
<main>
    <div class="rows">
      <p class="label">Our products</p>
      <section class="item ns" data-live data-tint="#2de2e6" style="--tone:var(--cyan)">
        <a class="head" href="/north-star/">
          <span class="title">North Star</span><svg class="go" viewBox="0 0 32 24" aria-hidden="true"><path d="M1 12h29M20 2l10 10-10 10"/></svg>
        </a>
        <div class="more"><div><div class="inner">
          <p>One workspace for your idea: its canvas, tasks and conversations, and an agent that knows all of it.</p>
        </div></div></div>
      </section>
      <section class="item g" data-soon data-tint="#e8264f" style="--tone:var(--orrery)">
        <button class="head" type="button" aria-expanded="false">
          <span class="title">Orrery</span><span class="state"><span class="lamp"></span>coming soon</span>
        </button>
        <div class="more"><div><div class="inner">
          <p>The context layer for AI.</p>
          <div class="formwrap">
            <form data-waitlist novalidate>
              <input class="well" type="email" name="email" placeholder="you@example.com" autocomplete="email" aria-label="Your email">
              <input class="trap" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
              <button class="button" type="submit" style="--accent:var(--orrery)">join the waitlist</button>
            </form>
            <p class="note" data-note role="status">Only to tell you when Orrery is ready. We send a link to confirm. <a href="/privacy">Privacy</a></p>
          </div>
        </div></div></div>
      </section>
    </div>
  </main>
</div>
<script type="module">
  import { backdrop as atemBackdrop } from '/kit/src/backdrop.js?v=0.1.1';
  const field = atemBackdrop(document.querySelector('canvas.field'));

  // Every first letter has its own side space. Draw the first letters on a canvas and find where their ink really starts:
  // each row's text then starts its ink on ATEM's ink edge, and its name is pulled left to the same edge.
  const inkLeft = (font, ch) => {
    const c = document.createElement('canvas'); c.width = 400; c.height = 300;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.font = font; x.textBaseline = 'middle'; x.fillText(ch, 100, 150);
    const d = x.getImageData(0, 0, 400, 300).data;
    for (let col = 0; col < 400; col++) for (let row = 0; row < 300; row++) if (d[(row * 400 + col) * 4 + 3] > 40) return col - 100;
    return 0;
  };
  const fontOf = (el) => { const cs = getComputedStyle(el); return `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`; };
  const align = () => {
    const h1 = document.querySelector('h1');
    const edge = h1.getBoundingClientRect().left + inkLeft(fontOf(h1.querySelector('.lab')), 'a');
    const rowsLeft = document.querySelector('.rows').getBoundingClientRect().left;
    for (const t of document.querySelectorAll('.title')) {
      const item = t.closest('.item'), p = item.querySelector('.inner p');
      const first = getComputedStyle(t).textTransform === 'lowercase' ? t.textContent[0].toLowerCase() : t.textContent[0];
      const pInk = inkLeft(fontOf(p), p.textContent.trim()[0]);
      item.style.setProperty('--inset', `${Math.max(0, edge - rowsLeft - pInk).toFixed(1)}px`);
      t.style.setProperty('--pull', (inkLeft(fontOf(t), first) - pInk).toFixed(1));
    }
  };
  // The name is typed later, so its face isn't asked for yet: ask.
  Promise.all([document.fonts.load(fontOf(document.querySelector('.lab')), 'a'), document.fonts.ready]).then(align);

  addEventListener('resize', align);

  // The name, typed: atem as the page opens, then a slash and the open row's product; letter by letter erased again.
  // `lab` and `n` are how much is on screen of atem and of "/product"; every step goes one letter towards what is wanted.
  const name = (() => {
    const h1 = document.querySelector('h1'), labEl = h1.querySelector('.lab'), of = h1.querySelector('.of');
    const LAB = 'atem', START = 450, TYPE_LAB = 130, TYPE = 48, ERASE = 22, REST = 350;
    let lab = 0, n = 0, shown = null, wanted = null, timer = 0;
    const text = (item) => (item ? '/' + item.querySelector('.title').textContent : '');
    const draw = () => {
      labEl.textContent = LAB.slice(0, lab);
      if (n) h1.dataset.of = shown.classList.contains('ns') ? 'ns' : 'g'; else h1.removeAttribute('data-of');
      of.textContent = text(shown).slice(1, Math.max(1, n));
    };
    const step = () => {
      timer = 0;
      let wait = 0;
      if (lab < LAB.length) { lab++; wait = TYPE_LAB; }
      else if (shown !== wanted && n > 0) { n--; wait = ERASE; }
      else {
        shown = wanted;
        if (n < text(shown).length) { n++; wait = TYPE; }
      }
      draw();
      if (wait) { h1.dataset.typing = ''; timer = setTimeout(step, wait); }
      else timer = setTimeout(() => { timer = 0; h1.removeAttribute('data-typing'); if (shown !== wanted) step(); }, REST);
    };
    const start = () => { clearTimeout(timer); step(); };
    // Coming back is not opening: the name is simply there.
    const entry = performance.getEntriesByType('navigation')[0];
    if (entry && entry.type === 'back_forward') { lab = LAB.length; draw(); }
    else timer = setTimeout(step, START);
    return {
      set(item) {
        if (item === wanted) return;
        wanted = item;
        if (lab === LAB.length) start();
      },
      reset() {
        clearTimeout(timer);
        timer = 0; lab = LAB.length; n = 0; shown = wanted = null;
        h1.removeAttribute('data-typing');
        draw();
      },
    };
  })();

  // One row open at a time: pointing opens it, a press keeps it open (touch has no pointing), leaving goes back to the
  // kept one.
  const items = [...document.querySelectorAll('.item')];
  let kept = null;
  const show = (item) => {
    for (const it of items) {
      const on = it === item;
      it.classList.toggle('open', on);
      const head = it.querySelector('button.head');
      if (head) head.setAttribute('aria-expanded', on);
    }
    name.set(item);
    field.setTint(item ? item.dataset.tint : null, item ? 0.82 : 0);
  };
  for (const it of items) {
    it.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') show(it); });
    it.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse' && !it.querySelector(':focus-visible')) show(kept); });
    const head = it.querySelector('button.head');
    if (head) head.addEventListener('click', () => { kept = kept === it ? null : it; show(kept); });
    it.addEventListener('focusin', (e) => { if (e.target.matches(':focus-visible')) show(it); });
  }
  // The browser keeps this page as it was left and hands it back on "back", the followed row still open and focused.
  // Leave it closed; on return the pointer may already be over a row, which says nothing until it moves.
  const rest = () => {
    if (document.activeElement) document.activeElement.blur();
    kept = null;
    show(null);
    name.reset();
  };
  addEventListener('pagehide', rest);
  addEventListener('pageshow', (e) => {
    if (!e.persisted) return;
    rest();
    addEventListener('pointermove', (m) => {
      const it = m.pointerType === 'mouse' && m.target.closest && m.target.closest('.item');
      if (it) show(it);
    }, { once: true });
  });

  // The waitlist (D-429 in North Star's memory bank): the email goes to the joinWaitlist function, which keeps it in
  // Firestore. Local tries can point it elsewhere: 127.0.0.1/?endpoint=<url>.
  (() => {
    const local = location.hostname === '127.0.0.1' && new URLSearchParams(location.search).get('endpoint');
    const ENDPOINT = local || 'https://europe-west1-north-star-db.cloudfunctions.net/joinWaitlist';
    const form = document.querySelector('[data-waitlist]');
    const note = document.querySelector('[data-note]');
    const button = form.querySelector('button');
    const first = note.innerHTML;
    const say = (text, state) => { note.textContent = text; note.dataset.state = state || ''; };
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = form.email.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return say("That doesn't look like an email.", 'error');
      button.disabled = true;
      say('Sending…');
      try {
        const res = await fetch(ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, product: 'orrery', website: form.website.value }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Something went wrong. Try again.');
        form.reset();
        say("Check your inbox and confirm: we sent you a link.", 'ok');
      } catch (err) {
        say(err.message === 'Failed to fetch' ? "Couldn't reach us. Try again." : err.message, 'error');
      } finally {
        button.disabled = false;
      }
    });
    form.email.addEventListener('input', () => { if (note.dataset.state === 'error') { note.innerHTML = first; note.dataset.state = ''; } });
  })();
</script>
</body>
</html>
