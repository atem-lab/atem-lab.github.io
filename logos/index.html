<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logos · ATEM</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.ico?v=3" sizes="32x32">
<link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/name.css?v=4">
<style>
  @font-face { font-family: 'JetBrains Mono'; src: url('/fonts/jetbrains-mono.woff2') format('woff2'); font-weight: 100 800; font-display: swap; }
  @font-face { font-family: 'Major Mono Display'; src: url('/fonts/major-mono-display.woff2') format('woff2'); font-display: swap; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; color: #fff; }
  canvas { display: block; }
  header { padding: 16px 24px 0; }
  h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  main { max-width: 1240px; margin: 0 auto; padding: 120px 24px 160px; display: flex; flex-direction: column; gap: 160px; }
  .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 96px 48px; justify-items: center; align-items: center; }
  @media (max-width: 860px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><a class="name" href="/" aria-label="ATEM, home"><span class="lab" aria-hidden="true">atem</span><span class="slash" aria-hidden="true"></span></a></header>
<main>
  <h1>Logos</h1>
  <div class="row">
    <canvas data-k="icon" data-p="atem" data-v="solid" data-s="220"></canvas>
    <canvas data-k="icon" data-p="atem" data-v="colour" data-s="220"></canvas>
    <canvas data-k="word" data-p="atem" data-v="solid" data-m="72"></canvas>
    <canvas data-k="word" data-p="atem" data-v="colour" data-m="72"></canvas>
  </div>
  <div class="row">
    <canvas data-k="icon" data-p="ns" data-v="solid" data-s="220"></canvas>
    <canvas data-k="icon" data-p="ns" data-v="colour" data-s="220"></canvas>
    <canvas data-k="word" data-p="ns" data-v="solid" data-m="48"></canvas>
    <canvas data-k="word" data-p="ns" data-v="colour" data-m="48"></canvas>
  </div>
  <div class="row">
    <canvas data-k="icon" data-p="g" data-v="solid" data-s="220"></canvas>
    <canvas data-k="icon" data-p="g" data-v="colour" data-s="220"></canvas>
    <canvas data-k="word" data-p="g" data-v="solid" data-m="56"></canvas>
    <canvas data-k="word" data-p="g" data-v="colour" data-m="56"></canvas>
  </div>
</main>
<script src="/mark.js"></script>
<script>
(() => {
  const M = window.atemMark, dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  const els = [...document.querySelectorAll('canvas[data-k]')].map((el) => ({ el, ctx: el.getContext('2d'), d: el.dataset, key: '' }));
  function size(o) {
    const d = o.d;
    if (d.k === 'word') {
      const m = +d.m, w = Math.ceil(M.wordWidth(o.ctx, { m, product: d.p }) + 0.1 * m), h = Math.ceil(1.3 * m);
      o.el.width = Math.round(w * dpr); o.el.height = Math.round(h * dpr); o.el.style.width = w + 'px'; o.el.style.height = h + 'px';
    } else {
      // favicons at the size a tab shows them, drawn on their own 16-px grid
      const s = +d.s;
      o.el.width = o.el.height = Math.round(s * dpr); o.el.style.width = o.el.style.height = s + 'px';
    }
  }
  function draw(o, t) {
    const d = o.d, colour = d.v === 'colour', still = !!d.still;
    const on = colour ? true : (d.k === 'fav' ? true : M.blinkOn(t));
    const key = on + '|' + (colour && !still ? M.tick : 0);
    if (key === o.key) return; o.key = key;
    if (d.k === 'word') {
      o.ctx.setTransform(dpr, 0, 0, dpr, 0, 0); o.ctx.clearRect(0, 0, o.el.width, o.el.height);
      M.word(o.ctx, { m: +d.m, x: 0, base: +d.m, product: d.p, variant: colour ? 'colour' : 'solid', still, on });
    } else {
      M.icon(o.ctx, o.el.width, { product: d.p, variant: colour ? 'colour' : 'solid', still, mode: d.k === 'fav' ? 'fav' : 'bleed', on });
    }
  }
  function loop(t) { M.step(); for (const o of els) draw(o, t); requestAnimationFrame(loop); }
  const fonts = ['400 20px Michroma', '400 20px "JetBrains Mono"', '400 20px "Major Mono Display"'].map((f) => document.fonts.load(f));
  Promise.all(fonts).finally(() => { els.forEach(size); requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
