<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000"><title>Contact · ATEM</title><style>
@font-face { font-family: 'JetBrains Mono'; src: url('/fonts/jetbrains-mono.woff2') format('woff2'); font-weight: 100 800; font-display: swap; }
@font-face { font-family: 'Inter'; src: url('/fonts/inter.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
:root { color-scheme: dark; --fg: #e6e6e6; --dim: #8a8a8a; --strong: #fff; --line: rgba(255,255,255,.16); --cyan: #2de2e6; --magenta: #ff3d9a; --green: #3dff8a; --tone: var(--cyan);
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace; --sans: 'Inter', system-ui, sans-serif; --ease: cubic-bezier(.16,1,.3,1); }
::selection { background: var(--tone); color: #000; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: #000; color: var(--fg); font: 400 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
body { display: flex; flex-direction: column; min-height: 100svh; padding: 24px; }
header { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; position: relative; z-index: 2; }
.atem { font: 800 clamp(40px, 3.95vw, 75px)/1 var(--sans); letter-spacing: -.04em; color: #fff; text-decoration: none; white-space: nowrap; }
.atem svg { width: .74em; height: 1em; vertical-align: top; margin: 0 -.02em 0 .01em; overflow: visible; }
nav { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px 16px; margin-top: -8px; font: 400 12px/1.4 var(--mono); letter-spacing: .06em; }
nav a { color: var(--dim); text-decoration: none; } nav a:hover { color: #fff; }
a { color: #fff; text-underline-offset: 3px; text-decoration-color: var(--dim); }
:focus-visible { outline: 2px solid var(--tone); outline-offset: 3px; }
[hidden] { display: none !important; }
input, textarea { font: inherit; color: #fff; caret-color: var(--tone); }
.send { position: relative; height: 48px; padding: 0 26px; border: 0; border-radius: 999px; background: #fff; color: #000; font: 500 16px/1 var(--sans); cursor: pointer; isolation: isolate; overflow: hidden; transition: transform 70ms; }
.send::before { content: ''; position: absolute; inset: 0; z-index: -1; background: var(--tone); transform: scaleX(0); transform-origin: left; transition: transform 400ms var(--ease); }
.send:hover::before, .send:focus-visible::before { transform: scaleX(1); } .send:active { transform: scale(.97); } .send:disabled { opacity: .5; }
.note { margin: 0; font-size: 14px; color: var(--dim); } .note[data-state=ok] { color: var(--cyan); } .note[data-state=error] { color: var(--magenta); }
.check { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; } .check input { appearance: none; flex: none; width: 20px; height: 20px; margin: 2px 0 0; border: 1px solid rgba(255,255,255,.5); border-radius: 6px; display: grid; place-items: center; cursor: pointer; }
.check input:checked { background: var(--tone); border-color: var(--tone); } .check input:checked::after { content: ''; width: 5px; height: 10px; border: solid #000; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
@media (max-width: 760px) { body { padding: 16px; } nav { margin-top: 0; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

main { flex: 1; display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 6fr); gap: 64px; align-items: center; max-width: 1240px; width: 100%; margin: 0 auto; padding: 56px 0; }
h1 { margin: 0 0 20px; font: 500 clamp(44px, 6vw, 92px)/.95 var(--sans); letter-spacing: -.04em; color: #fff; } .intro p { margin: 0; max-width: 24em; font-size: 18px; }
form { display: grid; gap: 16px; }
/* Choice chips: each its own colour, the chosen one filled. */
.top { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.t { position: relative; cursor: pointer; } .t input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.t span { display: flex; align-items: center; height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); font: 500 14px/1 var(--mono); color: var(--c); transition: background 250ms, color 250ms; }
.t:has([value=question]) { --c: var(--cyan); } .t:has([value=privacy]) { --c: var(--green); } .t:has([value=report]) { --c: var(--magenta); }
.t:hover span { background: color-mix(in srgb, var(--c) 16%, transparent); } .t input:checked + span { background: var(--c); border-color: var(--c); color: #000; } .t input:focus-visible + span { outline: 2px solid #fff; outline-offset: 2px; }
/* One look for every field. */
form > textarea, .place, .meta input { width: 100%; border: 1px solid rgba(255,255,255,.42); border-radius: 14px; background: rgba(255,255,255,.05); padding: 0 16px; font-size: 16px; line-height: 1.5; outline: none; transition: border-color 200ms, box-shadow 200ms; }
.place, .meta input { height: 48px; } form > textarea { min-height: 200px; padding: 12px 16px; resize: vertical; }
form > textarea:focus, .place:focus, .meta input:focus { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan); }
::placeholder { color: rgba(255,255,255,.55); opacity: 1; }
.meta { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 8px; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; gap: 32px; align-items: start; align-content: start; padding: 40px 0; } .meta { grid-template-columns: 1fr; } }
</style></head><body>
<header><a class="atem" href="/" aria-label="ATEM, home"><span aria-hidden="true">A<svg viewBox="0 0 74 100"><defs><linearGradient id="plus" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="74" y2="86"><stop offset="0" stop-color="#2de2e6"/><stop offset="1" stop-color="#ff3d9a"/></linearGradient></defs><path fill="none" stroke="url(#plus)" stroke-width="15" d="M37 14V70Q37 86 53 86H60M4 47H70"/></svg>EM</span></a><nav aria-label="Legal"><a href="/impressum.html">Impressum</a><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a></nav></header>
<main><div class="intro"><h1>Write<br>to us</h1><p>Questions, your data, or illegal content in North Star. We answer by email, in English or German: <a href="mailto:atahankilic.dev@gmail.com">atahankilic.dev@gmail.com</a></p></div><form novalidate>
<div class="top" role="radiogroup" aria-label="What is it about?"><label class="t"><input type="radio" name="topic" value="question" checked><span>question</span></label><label class="t"><input type="radio" name="topic" value="privacy"><span>privacy</span></label><label class="t"><input type="radio" name="topic" value="report"><span>report</span></label></div>
<textarea name="message" aria-label="Your message" placeholder="What’s on your mind?" maxlength="5000"></textarea>
<input class="place" name="link" data-report hidden aria-label="Where the content is" placeholder="Where is it? Its address or workspace">
<div class="meta"><input name="name" autocomplete="name" aria-label="Your name" placeholder="Name"><input type="email" name="email" autocomplete="email" aria-label="Your email" placeholder="Email"></div>
<label class="check" data-report hidden><input type="checkbox" name="goodFaith"> I believe in good faith that this report is accurate and complete.</label>
<input hidden name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
<div class="foot"><p class="note" role="status">Only used to answer you. <a href="/privacy.html">Privacy</a></p><button class="send">Send</button></div></form></main>
<script>window.onTopic = (t) => { document.querySelector('[name=message]').placeholder = { question: 'What’s on your mind?', privacy: 'What should we show, correct or delete?', report: 'What is it, and why is it illegal?' }[t]; document.querySelector('[name=name]').placeholder = t === 'report' ? 'Name' : 'Name (optional)'; };
const form = document.querySelector('form'), note = form.querySelector('.note'), send = form.querySelector('.send');
const TOPICS = ['question', 'privacy', 'report'];
const topic = () => form.querySelector('[name=topic]:checked').value;
const show = () => { const t = topic(); document.body.dataset.topic = t;
  for (const el of document.querySelectorAll('[data-report]')) el.hidden = t !== 'report';
  for (const el of document.querySelectorAll('[data-for]')) el.hidden = !el.dataset.for.split(' ').includes(t); window.onTopic && onTopic(t); };
const asked = new URLSearchParams(location.search).get('topic'); if (TOPICS.includes(asked)) form.querySelector(`[value=${asked}]`).checked = true;
form.addEventListener('change', (e) => e.target.name === 'topic' && show()); setTimeout(show);
const local = location.hostname === '127.0.0.1' && new URLSearchParams(location.search).get('endpoint');
const ENDPOINT = local || 'https://europe-west1-north-star-db.cloudfunctions.net/contact';
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = form.elements, report = topic() === 'report';
  send.disabled = true;
  note.dataset.state = '';
  note.textContent = 'Sending…';
  try {
    const res = await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ topic: topic(), name: f.namedItem('name').value, email: f.email.value, link: report ? f.link.value : '', message: f.message.value, goodFaith: report && f.goodFaith.checked, website: f.website.value }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Something went wrong. Try again.');
    form.reset();
    show();
    note.dataset.state = 'ok';
    note.textContent = report ? 'Received. We look at it and write to you with the decision.' : 'Sent. We answer by email.';
  } catch (err) {
    note.dataset.state = 'error';
    note.textContent = err instanceof TypeError ? "Couldn't reach us. Try again." : err.message;
  } finally {
    send.disabled = false;
  }
});
</script></body></html>
