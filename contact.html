<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000"><title>Contact · ATEM</title>
<link rel="icon" href="/favicon.ico?v=3" sizes="32x32">
<link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/kit/src/fonts.css?v=0.1.1">
<link rel="stylesheet" href="/kit/src/name.css?v=0.1.1">
<link rel="stylesheet" href="/legal.css?v=6">
</head><body>
<header><a class="name" href="/" aria-label="ATEM, home"><span class="lab" aria-hidden="true">atem</span><span class="slash" aria-hidden="true"></span></a><nav aria-label="Legal"><a href="/impressum">Impressum</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a><a href="/contact" aria-current="page">Contact</a></nav></header>
<main><div class="intro"><a class="back" href="/">← back</a><h1>Write<br>to us</h1><p>Questions, your data, or illegal content in North Star. We answer by email, in English or German: <a href="mailto:atahankilic.dev@gmail.com">atahankilic.dev@gmail.com</a></p></div><form class="contact" novalidate>
<div class="top" role="radiogroup" aria-label="What is it about?"><label class="t"><input type="radio" name="topic" value="question" checked><span>question</span></label><label class="t"><input type="radio" name="topic" value="privacy"><span>privacy</span></label><label class="t"><input type="radio" name="topic" value="report"><span>report</span></label></div>
<textarea name="message" aria-label="Your message" placeholder="What’s on your mind?" maxlength="5000"></textarea>
<input class="place" name="link" data-report hidden aria-label="Where the content is" placeholder="Where is it? Its address or workspace">
<div class="meta"><input name="name" autocomplete="name" aria-label="Your name" placeholder="Name"><input type="email" name="email" autocomplete="email" aria-label="Your email" placeholder="Email"></div>
<label class="check" data-report hidden><input type="checkbox" name="goodFaith"> I believe in good faith that this report is accurate and complete.</label>
<input hidden name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
<div class="end"><p data-note role="status">Only used to answer you. <a href="/privacy">Privacy</a></p><button>Send</button></div></form></main>
<script>window.onTopic = (t) => { document.querySelector('[name=message]').placeholder = { question: 'What’s on your mind?', privacy: 'What should we show, correct or delete?', report: 'What is it, and why is it illegal?' }[t]; document.querySelector('[name=name]').placeholder = t === 'report' ? 'Name' : 'Name (optional)'; };
const form = document.querySelector('form'), note = form.querySelector('[data-note]'), send = form.querySelector('button');
const TOPICS = ['question', 'privacy', 'report'];
const topic = () => form.querySelector('[name=topic]:checked').value;
const show = () => { const t = topic(); document.body.dataset.topic = t;
  for (const el of document.querySelectorAll('[data-report]')) el.hidden = t !== 'report';
  for (const el of document.querySelectorAll('[data-for]')) el.hidden = !el.dataset.for.split(' ').includes(t); window.onTopic && onTopic(t); };
const asked = new URLSearchParams(location.search).get('topic'); if (TOPICS.includes(asked)) form.querySelector(`[value=${asked}]`).checked = true;
form.addEventListener('change', (e) => e.target.name === 'topic' && show()); setTimeout(show);
const local = location.hostname === '127.0.0.1' && new URLSearchParams(location.search).get('endpoint');
const ENDPOINT = local || 'https://europe-west1-north-star-db.cloudfunctions.net/contact';
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = form.elements, report = topic() === 'report';
  send.disabled = true;
  note.dataset.state = '';
  note.textContent = 'Sending…';
  try {
    const res = await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ topic: topic(), name: f.namedItem('name').value, email: f.email.value, link: report ? f.link.value : '', message: f.message.value, goodFaith: report && f.goodFaith.checked, website: f.website.value }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Something went wrong. Try again.');
    form.reset();
    show();
    note.dataset.state = 'ok';
    note.textContent = report ? 'Received. We look at it and write to you with the decision.' : 'Sent. We answer by email.';
  } catch (err) {
    note.dataset.state = 'error';
    note.textContent = err instanceof TypeError ? "Couldn't reach us. Try again." : err.message;
  } finally {
    send.disabled = false;
  }
});
</script></body></html>
